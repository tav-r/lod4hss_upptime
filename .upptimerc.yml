# Change these first
owner: tav-r # Your GitHub organization or username, where this repository lives
repo: lod4hss_upptime # The name of this repository

sites:
  # --- Main site (GitHub Pages) ---
  - name: LOD4HSS
    url: https://lod4hss.org
  - name: www Redirect
    url: https://www.lod4hss.org
    # 301 -> https://lod4hss.org/ ; 30x counts as up by default

  # --- Services on 134.158.33.207 ---
  - name: Geovistory
    url: https://geovistory.lod4hss.org
  - name: Fuseki
    url: https://fuseki.lod4hss.org
  - name: Outline
    url: https://outline.lod4hss.org
  - name: GraphDB
    url: https://graphdb.lod4hss.org
    expectedStatusCodes:
      - 403 # root is forbidden; service is reachable
  - name: SPARQL GraphDB
    url: https://sparql-gdb.lod4hss.org
    expectedStatusCodes:
      - 401 # auth-protected endpoint
  - name: Open GraphDB
    url: https://open-gdb.lod4hss.org
    # 302 -> /admin/ ; 30x counts as up by default
  - name: Design System
    url: https://design-system.lod4hss.org
    # NOTE: currently serves a certificate for CN=agenda.larhra.fr, so TLS
    # verification fails. This will report DOWN until the vhost is fixed.
    # Add `__dangerous__insecure: true` to skip verification instead.

  # --- Project sites (GitHub Pages) ---
  - name: Elites Suisses
    url: https://elites-suisses.lod4hss.org
  - name: OntoMe Docs
    url: https://ontome-doc.lod4hss.org
  - name: NEPOC
    url: https://nepoc.lod4hss.org
  - name: EOS
    url: https://eos.lod4hss.org
  - name: Humility
    url: https://humility.lod4hss.org
  - name: HISB
    url: https://hisb.lod4hss.org
  - name: Borders
    url: https://borders.lod4hss.org

status-website:
  # Base theme; the `css` block below restyles it with the lod4hss.org palette
  theme: light
  # No custom domain yet, so the site lives at <owner>.github.io/<repo>
  baseUrl: /lod4hss_upptime
  name: LOD4HSS Status
  introTitle: "**LOD4HSS** service status"
  introMessage: Uptime for the [lod4hss.org](https://lod4hss.org) sites and services. Powered by **real-time** data from this [GitHub repository](https://github.com/$OWNER/$REPO) — no server required, just GitHub Actions, Issues, and Pages.
  navbar:
    - title: Status
      href: /
    - title: LOD4HSS
      href: https://lod4hss.org
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  # lod4hss.org declares Montserrat but never loads a webfont, so load it here
  links:
    - rel: stylesheet
      href: "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"

  # Palette lifted from https://lod4hss.org/assets/css/app.css (Bulma):
  #   primary #188eac | text #363636 / #0a0a0a | surfaces #fff / #f5f5f5
  #   borders #dbdbdb | success #48c78e | warning #ffe08a | danger #f14668
  css: |
    :root {
      /* Surfaces and text */
      --body-background-color: #f5f5f5;
      --body-text-color: #363636;
      --card-background-color: #ffffff;
      --card-border-color: #dbdbdb;

      /* Navbar; the pure brand teal is decorative here, so it stays exact */
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #dbdbdb;
      --nav-current-border-bottom-color: #188eac;

      /* Status accents: bright Bulma hues for the card edge ... */
      --up-border-left-color: #48c78e;
      --degraded-border-left-color: #ffe08a;
      --down-border-left-color: #f14668;
      --down-background-color: #feecf0;

      /* ... and Bulma's dark variants for tags, so white text stays legible */
      --tag-color: #ffffff;
      --tag-up-background-color: #257953;
      --tag-degraded-background-color: #946c00;
      --tag-down-background-color: #cc0f35;
      --change-background-color: #946c00;

      /* Buttons: #157e99 is the brand teal nudged one step darker (same
         192deg hue) so white label text clears WCAG AA at 4.69:1;
         the pure #188eac only reaches 3.82:1 */
      --submit-button-background-color: #157e99;
      --submit-button-border-color: #136f88;
      --submit-button-color: #ffffff;
      --error-button-background-color: #157e99;
      --error-button-border-color: #136f88;
      --error-button-color: #ffffff;

      --graph-opacity: 1;
      --graph-filter: none;
    }

    body {
      font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    /* Bulma-ish heading weight and the darker heading ink from the site */
    h1, h2, h3, h4, h5, h6 {
      color: #0a0a0a;
      font-weight: 600;
    }

    /* Links pick up the brand teal (AA-safe shade, as above) instead of
       inheriting body text */
    .container a:not(.navbar-item) {
      color: #157e99;
    }
